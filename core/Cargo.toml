[package]
name = "riko-memory"
version = "0.2.0"
edition = "2021"

[lib]
name = "riko_memory"
path = "src/lib.rs"

[[bin]]
name = "riko-memory"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
regex = "1.10"
walkdir = "2.5"
anyhow = "1.0"
libc = "0.2"
zstd = "0.13"
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
